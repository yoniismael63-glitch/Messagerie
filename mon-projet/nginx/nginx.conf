# ==============================================================================
# Configuration NGINX Reverse Proxy - Messagerie Souveraine Matrix
# Contexte : Administration Publique du Burkina Faso (Jour 1 & Jour 2)
# ==============================================================================
# Ce fichier achemine le trafic :
#   - '/_matrix/' et '/_synapse/' vers le homeserver Synapse (port 8008)
#   - Protection par rate-limiting sur le point d'authentification (/login)
#   - En-têtes de durcissement (X-Frame-Options, X-Content-Type-Options, etc.)
#   - Tout le reste ('/') vers l'interface web officielle Element
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Taille maximale des pièces jointes et documents transmis par les agents
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # JOUR 2 : Durcissement Sécuritaire & Protection Anti-Bruteforce
    # --------------------------------------------------------------------------
    # Zone de limitation pour l'authentification (5 requêtes/minute par IP)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # Zone de limitation générale pour prévenir les dénis de service (DoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # En-têtes de sécurité HTTP régaliens
        # ----------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. Protection spécifique du endpoint de connexion (/login)
        # ----------------------------------------------------------------------
        location ~* ^/_matrix/client/[^/]+/login$ {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----------------------------------------------------------------------
        # 2. Acheminement des autres API Matrix & Synapse vers le homeserver
        # ----------------------------------------------------------------------
        location ~* ^(/_matrix|/_synapse) {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # Gestion des connexions persistantes et WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout allongé indispensable pour le mécanisme de long-polling /_matrix/client/v3/sync
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------------------
        # 3. Acheminement vers l'interface Web Element
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://element:80;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }
    }
}
